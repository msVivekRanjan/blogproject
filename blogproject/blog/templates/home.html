<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Blog</title>
</head>
<body>
    <h1>Simple Blog Application</h1>

    {% for post in posts %}
        <h2>{{ post.title }}</h2>
        <small>{{ post.date_posted|date:"F d, Y H:i" }}</small>
        <hr>
    {% empty %}
        <p>No posts available.</p>
    {% endfor %}

    
</body>
</html>
